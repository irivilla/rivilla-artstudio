<a class="card-service" (click)="navigate()" [attr.aria-label]="'Ver servicio: ' + title">
  <img class="card-service__image" [src]="imageSrc" [alt]="title" loading="lazy" />

  <div class="card-service__overlay">
    <div class="card-service__content">
      <h3 class="card-service__title">{{ title }}</h3>
      <p class="card-service__subtitle">{{ subtitle }}</p>
    </div>
  </div>
</a>
