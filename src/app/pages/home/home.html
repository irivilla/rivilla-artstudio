<div class="container-fluid container-home">
    <app-carrousel></app-carrousel>

    <main class="container-fluid container-home__content">

        <div class="row g-0">
            <div class="col-12 logo-header img-fluid">
                <img src="../../../assets/img/logo/logo1.webp"
                    alt="RIVILLA art studio, ilustración artística y arte en vivo para bodas y eventos"
                    fetchpriority="high">
            </div>
        </div>

        <div class="row">
            <div class="col-12 slogan-header">
                <h6>
                    {{ 'PAGES.HOME.SLOGAN1' | translate }}
                </h6>

                <p>
                    "{{ 'PAGES.HOME.SLOGAN2' | translate }}"
                </p>
            </div>
        </div>

        <div class="row g-0">
            <div class="col-12">
                <img src="../../../assets/img/deco/flor1_doble.webp" alt="flor decorativa"
                    class="img-fluid img-deco-home" fetchpriority="high">
            </div>
        </div>

        <section class="row g-0" aria-label="Información y presupuesto para arte en vivo en bodas y eventos">
            <div class="col-12">
                <app-card-budget></app-card-budget>
            </div>
        </section>

        <section aria-labelledby="home-services-title">
            <div class="row mt-5 g-0">
                <div class="col-12 mb-3">
                    <h2 id="home-services-title">
                        {{ 'PAGES.HOME.SERVICES-TITLE' | translate }}
                    </h2>
                </div>
            </div>

            <div class="row justify-content-center g-4">
                <div class="col-12 col-md-6 col-lg-4 card-photo-home" *ngFor="let card of cards">
                    <app-card-photo [title]="card.title" [imageSrc]="card.image" [route]="card.route"></app-card-photo>
                </div>
            </div>
        </section>

        <div class="row g-0 ">
            <div class="col-12 ">
                <img src="../../../assets/img/deco/flor2.webp" alt="flor decorativa" class="img-fluid img-deco-home"
                    fetchpriority="high">
            </div>
        </div>

        <section aria-labelledby="home-questions-title">
            <div class="row mt-5">
                <div class="col-12 mb-3">
                    <h2 id="home-questions-title">
                        {{ 'PAGES.HOME.QUESTIONS' | translate }}
                    </h2>
                </div>
            </div>

            <div class="row d-flex justify-content-center">
                <div class="col-10 col-lg-8">
                    <app-accordion></app-accordion>
                </div>
            </div>
        </section>

        <section aria-labelledby="home-reviews-title">
            <div class="row mt-5">
                <div class="col-12">
                    <h2 id="home-reviews-title">
                        {{ 'PAGES.HOME.REVIEWS' | translate }}
                    </h2>
                </div>
            </div>

            <div class="row">
                <div class="col-12 mb-3" aria-label="Valoración de cinco estrellas">
                    <i class="fas fa-star" aria-hidden="true"></i>
                    <i class="fas fa-star" aria-hidden="true"></i>
                    <i class="fas fa-star" aria-hidden="true"></i>
                    <i class="fas fa-star" aria-hidden="true"></i>
                    <i class="fas fa-star" aria-hidden="true"></i>
                </div>
            </div>

            <div class="row d-flex justify-content-center mb-3">
                <div class="col-xl-10 col-lg-8 col-md-10 col-sm-12">
                    <app-reviews></app-reviews>
                </div>
            </div>
        </section>

        <div class="row g-0">
            <div class="col-12">
                <img src="../../../assets/img/deco/flor1_doble.webp" alt="flor decorativa"
                    class="img-fluid img-deco-home" fetchpriority="high">
            </div>
        </div>

        <section aria-labelledby="conoce a nuestro equipo">
            <app-conocenos></app-conocenos>
        </section>

    </main>
</div>
