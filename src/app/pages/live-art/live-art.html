<div class="wrapper">
    <div class="row">
        <app-breadcrumb></app-breadcrumb>
    </div>

    <div class="row">

        <div class="col-12 title-live-art">
            <h1>
                {{ 'PAGES.LIVE-ART.TITLE' | translate }}
            </h1>

            <h3>{{ 'PAGES.LIVE-ART.SUBTITLE' | translate }}</h3>
        </div>
    </div>

    <div class="row g-0 row-cards">
        <div class="col-12 card-service" *ngFor="let card of cards">
            <app-card-service [title]="card.title" [subtitle]="card.subtitle" [imageSrc]="card.image"
                [route]="card.route"></app-card-service>
        </div>
    </div>

    <div class="row">
        <div class="col-12 d-flex justify-content-center mb-5">
            <div class="card card-contact w-50">
                <div class="card-body">
                    <h5 class="card-title">Card title</h5>
                    <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
                    <app-button class="m-2" type="primary" [text]="'BOTON'"></app-button>
                    <app-button class="m-2" type="secondary" [text]="'BOTON 2'"></app-button>
                </div>
            </div>

        </div>
    </div>

</div>
